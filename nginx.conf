# Derrière un proxy qui termine le HTTPS : on transmet son X-Forwarded-Proto
# au blog, sinon Symfony génère des liens et des redirections en http://.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $fwd_proto $fwd_port {
    https   443;
    default $server_port;
}

server {
    listen 80;
    server_name localhost;

    # Landing React, servie sous /a-propos (index.html + ses fichiers statiques)
    location = /a-propos {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ~ ^/(assets|downloads)/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ~ ^/(favicon\.svg|icons\.svg)$ {
        root /usr/share/nginx/html;
    }

    # Tout le reste : blog Symfony (accueil, articles, qui sommes-nous, admin...)
    location / {
        proxy_pass http://blog-nginx;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Port $fwd_port;
    }
}
