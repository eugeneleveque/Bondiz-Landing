# Derrière un proxy qui termine le HTTPS : on transmet son X-Forwarded-Proto
# au blog, sinon Symfony génère des liens et des redirections en http://.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Pas de X-Forwarded-Port forcé ici : $server_port vaut 80 dans le conteneur,
# alors que le port public diffère (3012). Le blog le lit dans l'en-tête Host.
server {
    listen 80;
    server_name localhost;

    location ~ ^/(assets|downloads)/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ~ ^/(favicon\.svg|icons\.svg)$ {
        root /usr/share/nginx/html;
    }

    # Tout le reste : blog Symfony (accueil, articles, à propos, admin...)
    location / {
        proxy_pass http://blog-nginx;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
