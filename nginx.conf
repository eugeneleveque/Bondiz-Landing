server {
    listen 80;
    server_name localhost;

    # Landing React, servie sous /a-propos (index.html + ses fichiers statiques)
    location = /a-propos {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ~ ^/(assets|downloads)/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ~ ^/(favicon\.svg|icons\.svg)$ {
        root /usr/share/nginx/html;
    }

    # Tout le reste : blog Symfony (accueil, articles, qui sommes-nous, admin...)
    location / {
        proxy_pass http://blog-nginx;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
