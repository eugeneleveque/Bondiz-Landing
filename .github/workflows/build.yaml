name: Build Images and Push Registry

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_NAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Landing React + reverse proxy (point d'entrée public)
      - name: Extract metadata for landing
        id: meta-landing
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_NAME }}/bondiz-landing
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push landing image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production-stage
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-landing.outputs.tags }}
          labels: ${{ steps.meta-landing.outputs.labels }}

      # Blog Symfony : PHP-FPM
      - name: Extract metadata for blog PHP
        id: meta-php
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_NAME }}/bondiz-blog
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push blog PHP image
        uses: docker/build-push-action@v5
        with:
          context: ./blog
          file: ./blog/docker/php/Dockerfile
          target: prod
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-php.outputs.tags }}
          labels: ${{ steps.meta-php.outputs.labels }}

      # Blog Symfony : nginx
      - name: Extract metadata for blog nginx
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_NAME }}/bondiz-blog-nginx
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push blog nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./blog
          file: ./blog/docker/nginx/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
